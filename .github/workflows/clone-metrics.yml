name: Update clone badges

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clone-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check traffic token
        id: token
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_READ_TOKEN }}
        run: |
          # A missing, expired or under-scoped token should not fail the run
          # (and email the owner every day). Skip with a visible warning instead.
          code=000
          if [ -n "$GH_TOKEN" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${{ github.repository }}/traffic/clones")
          fi
          if [ "$code" = 200 ]; then
            echo 'usable=true' >> "$GITHUB_OUTPUT"
          elif [ -z "$GH_TOKEN" ] || [ "$code" = 401 ] || [ "$code" = 403 ] || [ "$code" = 404 ]; then
            msg="TRAFFIC_READ_TOKEN is missing, expired or lacks Administration: read (HTTP $code); badges not updated. GitHub keeps only 14 days of clone data, so renew it soon. See references/repository_metrics.md."
            echo "::warning::$msg"
            echo "### Clone badges not updated" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo 'usable=false' >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected HTTP $code from the traffic API"
            exit 1
          fi
      - name: Update traffic history and badges
        if: steps.token.outputs.usable == 'true'
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_READ_TOKEN }}
        run: python3 scripts/update_clone_metrics.py
      - name: Commit the updated snapshot
        if: steps.token.outputs.usable == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/metrics
          if ! git diff --cached --quiet; then
            git commit -m 'Update clone traffic badges'
            git push
          fi
